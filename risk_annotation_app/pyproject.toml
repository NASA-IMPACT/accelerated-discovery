[project]
name = "risk-annotation-ui"
version = "0.1.0"
description = "FastAPI + Jinja2 UI for annotating model risk evaluation criteria"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.116.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "uvicorn==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
